services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentpi-net

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentpi-net

  user-service:
    build: ./user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8001
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CENTRAL_API_TOKEN: ${CENTRAL_API_TOKEN}
      CENTRAL_API_URL: ${CENTRAL_API_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rentpi-net

  rental-service:
    build: ./rental-service
    restart: unless-stopped
    ports:
      - "${RENTAL_SERVICE_PORT}:8002"
    environment:
      PORT: 8002
      CENTRAL_API_TOKEN: ${CENTRAL_API_TOKEN}
      CENTRAL_API_URL: ${CENTRAL_API_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rentpi-net

  analytics-service:
    build: ./analytics-service
    restart: unless-stopped
    ports:
      - "${ANALYTICS_SERVICE_PORT}:8003"
    environment:
      PORT: 8003
      CENTRAL_API_TOKEN: ${CENTRAL_API_TOKEN}
      CENTRAL_API_URL: ${CENTRAL_API_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8003/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rentpi-net

  agentic-service:
    build: ./agentic-service
    restart: unless-stopped
    ports:
      - "${AGENTIC_SERVICE_PORT}:8004"
    depends_on:
      mongo:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      rental-service:
        condition: service_healthy
    environment:
      PORT: 8004
      CENTRAL_API_TOKEN: ${CENTRAL_API_TOKEN}
      CENTRAL_API_URL: ${CENTRAL_API_URL}
      MONGO_URI: mongodb://mongo:27017/rentpi_agentic
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANALYTICS_SERVICE_URL: http://analytics-service:8003
      RENTAL_SERVICE_URL: http://rental-service:8002
      USER_SERVICE_URL: http://user-service:8001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8004/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rentpi-net

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:8000"
    depends_on:
      user-service:
        condition: service_healthy
      rental-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      agentic-service:
        condition: service_healthy
    environment:
      PORT: 8000
      USER_SERVICE_URL: http://user-service:8001
      RENTAL_SERVICE_URL: http://rental-service:8002
      ANALYTICS_SERVICE_URL: http://analytics-service:8003
      AGENTIC_SERVICE_URL: http://agentic-service:8004
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rentpi-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rentpi-net

volumes:
  postgres_data:
  mongo_data:

networks:
  rentpi-net:
    driver: bridge